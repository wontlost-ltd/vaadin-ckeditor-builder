server.port=8082

logging.level.root=info
logging.level.org.atmosphere=warn
logging.level.com.wontlost=debug

vaadin.launch-browser=true

# 禁用 Open-In-View（避免视图渲染中执行数据库查询）
spring.jpa.open-in-view=false

# CKEditor License Key
# Can be set via environment variable CKEDITOR_LICENSE_KEY or directly here
# Get your license key from https://ckeditor.com/pricing
# Use "GPL" for open source license (limited features)
ckeditor.license-key=\
  ${CKEDITOR_LICENSE_KEY:GPL}

# ================================
# CKEditor Cloud Services (Collaboration)
# ================================
# Get credentials from https://dashboard.ckeditor.com
ckeditor.collaboration.environment-id=${CKEDITOR_CS_ENVIRONMENT_ID:}
ckeditor.collaboration.api-secret=${CKEDITOR_CS_API_SECRET:}
ckeditor.collaboration.web-socket-url=${CKEDITOR_CS_WS_URL:}

# ================================
# H2 Database Configuration (Primary)
# ================================
spring.datasource.h2.url=jdbc:h2:file:./data/ckeditor-builder;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.h2.driver-class-name=org.h2.Driver
spring.datasource.h2.username=sa
spring.datasource.h2.password=

# H2 JPA Configuration
spring.jpa.h2.hibernate.ddl-auto=update
spring.jpa.h2.show-sql=false

# H2 Console (禁用，开发环境使用 application-dev.properties 启用)
spring.h2.console.enabled=false
spring.h2.console.path=/h2-console

# ================================
# Oracle ATP Database Configuration (Secondary)
# ================================
# Oracle ATP connection using TNS alias from wallet
spring.datasource.oracle.url=jdbc:oracle:thin:@${ORACLE_TNS_ALIAS:ckeditoratp_low}?TNS_ADMIN=${ORACLE_WALLET_PATH:./wallet}
spring.datasource.oracle.driver-class-name=oracle.jdbc.OracleDriver
spring.datasource.oracle.username=${ORACLE_USERNAME:ADMIN}
spring.datasource.oracle.password=${ORACLE_PASSWORD:}

# Oracle Connection Pool (UCP) - conservative settings for free tier
spring.datasource.oracle.hikari.minimum-idle=1
spring.datasource.oracle.hikari.maximum-pool-size=3
spring.datasource.oracle.hikari.connection-timeout=30000
spring.datasource.oracle.hikari.idle-timeout=600000
spring.datasource.oracle.hikari.max-lifetime=1800000

# Oracle JPA Configuration (ddl-auto=none, Oracle 表由 H2 ddl-auto=update 定义后手动同步)
spring.jpa.oracle.hibernate.ddl-auto=${ORACLE_DDL_AUTO:none}
spring.jpa.oracle.show-sql=false

# ================================
# Data Sync Configuration
# ================================
# Sync mode: REALTIME, SCHEDULED, MANUAL
app.sync.mode=${SYNC_MODE:REALTIME}
# Scheduled sync interval (milliseconds), default 5 minutes
app.sync.scheduled-interval=300000
# Enable Oracle sync (set to false to disable Oracle completely)
app.sync.oracle-enabled=${ORACLE_ENABLED:false}

# Health Check Configuration
app.sync.health-check.interval=30000
app.sync.health-check.failure-threshold=3
app.sync.health-check.recovery-threshold=3
app.sync.health-check.timeout=5000

# Retry Configuration
app.sync.retry.max-count=3
app.sync.retry.interval=900000
app.sync.retry.backoff-multiplier=1.5

# Failover Queue Configuration
app.sync.failover-queue.persistent=true
app.sync.failover-queue.file-path=./data/failover-queue.json
app.sync.failover-queue.max-size=10000
app.sync.failover-queue.persist-interval=5000

# Read-Write Split Configuration
app.sync.read-write-split.enabled=false
app.sync.read-write-split.read-strategy=H2_FIRST
app.sync.read-write-split.write-strategy=H2_ONLY

# Multi-Oracle Configuration
app.sync.multi-oracle.enabled=false
app.sync.multi-oracle.strategy=FAILOVER
# app.sync.multi-oracle.instances[0].name=primary
# app.sync.multi-oracle.instances[0].url=jdbc:oracle:thin:@primary_low
# app.sync.multi-oracle.instances[0].username=ADMIN
# app.sync.multi-oracle.instances[0].password=xxx
# app.sync.multi-oracle.instances[0].primary=true

# ================================
# AI Configuration (Optional)
# ================================
# Required for AI Document Editor preset (AI Assistant plugin)
ai.api-key=${AI_API_KEY:}
ai.model=${AI_MODEL:gpt-5}
ai.api-url=${AI_API_URL:https://api.openai.com/v1/chat/completions}

# AI 使用量限制（每 session，时间窗口内）
ai.usage-limit.session-max=${AI_SESSION_MAX:10}
ai.usage-limit.preview-session-max=${AI_PREVIEW_SESSION_MAX:3}
ai.usage-limit.window-ms=${AI_WINDOW_MS:18000000}

# ================================
# Cloudflare Turnstile (Login Protection)
# ================================
# Get credentials from https://dash.cloudflare.com → Turnstile
# Leave empty to disable Turnstile verification
turnstile.site-key=${TURNSTILE_SITE_KEY:}
turnstile.secret-key=${TURNSTILE_SECRET_KEY:}
turnstile.verify-url=${TURNSTILE_VERIFY_URL:https://challenges.cloudflare.com/turnstile/v0/siteverify}

# Admin credentials (change in production)
admin.username=${ADMIN_USERNAME:admin}
admin.password=${ADMIN_PASSWORD:}

# Exclude auto-configuration for custom dual datasource
spring.autoconfigure.exclude=\
  org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration,\
  org.springframework.boot.autoconfigure.orm.jpa.HibernateJpaAutoConfiguration
