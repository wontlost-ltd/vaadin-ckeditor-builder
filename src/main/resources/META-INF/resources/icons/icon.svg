<?xml version="1.0" encoding="UTF-8"?>
<!--
  Vaadin CKEditor Builder 应用图标（矢量母版）。

  设计意图：
  - 圆角方块底为品牌蓝 #2563eb → #3b82f6 渐变，与站内主色一致。
  - 白色 I 型文本光标（I-beam）居中，代表"编辑器"。
  - 光标两侧的短横线为文本行，代表"文档内容"。
  - 右下角实心方点代表"构建/装配"（Builder）。

  约束：所有元素笔画不小于画布的 6%，保证缩放到 16px favicon 时仍可辨识。
  修改本文件后需重新运行 scripts/gen-favicon.mjs 以同步位图产物。
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3b82f6"/>
      <stop offset="1" stop-color="#2563eb"/>
    </linearGradient>
  </defs>

  <!-- 底板 -->
  <rect width="512" height="512" rx="112" ry="112" fill="url(#bg)"/>

  <!-- 文本行（上、下），置于光标两侧 -->
  <rect x="104" y="146" width="304" height="48" rx="24" fill="#ffffff" opacity="0.55"/>
  <rect x="104" y="318" width="200" height="48" rx="24" fill="#ffffff" opacity="0.55"/>

  <!-- I 型文本光标：上下衬线 + 竖干 -->
  <rect x="188" y="146" width="136" height="48" rx="24" fill="#ffffff"/>
  <rect x="232" y="146" width="48" height="220" rx="24" fill="#ffffff"/>
  <rect x="188" y="318" width="136" height="48" rx="24" fill="#ffffff"/>

  <!-- Builder 标记：右下角方点 -->
  <rect x="336" y="318" width="72" height="72" rx="24" fill="#ffffff"/>
</svg>
