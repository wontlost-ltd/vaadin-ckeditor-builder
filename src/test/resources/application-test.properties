# 测试环境配置 - 仅使用 H2 内存数据库
server.port=0

# H2 内存数据库（测试隔离）
spring.datasource.h2.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1
spring.datasource.h2.driver-class-name=org.h2.Driver
spring.datasource.h2.username=sa
spring.datasource.h2.password=

spring.jpa.h2.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.h2.hibernate.ddl-auto=create-drop
spring.jpa.h2.show-sql=false

spring.h2.console.enabled=false

# 禁用 Oracle（测试环境不需要）
app.sync.oracle-enabled=false
app.sync.mode=REALTIME
app.sync.scheduled-interval=300000

# 健康检查
app.sync.health-check.interval=30000
app.sync.health-check.failure-threshold=3
app.sync.health-check.recovery-threshold=3
app.sync.health-check.timeout=5000

# 重试
app.sync.retry.max-count=3
app.sync.retry.interval=900000
app.sync.retry.backoff-multiplier=1.5

# 回写队列（测试中不持久化）
app.sync.failover-queue.persistent=false
app.sync.failover-queue.file-path=./build/test-failover-queue.json
app.sync.failover-queue.max-size=100
app.sync.failover-queue.persist-interval=60000

# 读写分离
app.sync.read-write-split.enabled=false
app.sync.read-write-split.read-strategy=H2_FIRST
app.sync.read-write-split.write-strategy=H2_ONLY

# 多 Oracle（禁用）
app.sync.multi-oracle.enabled=false
app.sync.multi-oracle.strategy=FAILOVER

# 禁用自动配置（使用自定义双数据源）
spring.autoconfigure.exclude=\
  org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration,\
  org.springframework.boot.autoconfigure.orm.jpa.HibernateJpaAutoConfiguration

# 管理员
admin.username=admin
admin.password=test

logging.level.com.wontlost=debug
