name: release

# 触发策略：发布只由 tag 驱动，main 推送仅作质量门禁。
# - pull_request: 仅跑测试
# - push main: 仅跑测试。main 无分支保护且习惯直接提交，保留此门禁以便尽早发现问题；
#   不构建镜像，避免与 tag 触发产生重复的镜像推送和重复的 GitOps PR
# - push tag v*: 测试 -> 构建 arm64 镜像 -> 推 Docker Hub（含 semver tag 5.2.0 / 5.2 / 5 / latest）
#   -> 向 k3s GitOps 仓库开 PR（k3s main 受分支保护，不能直推；合并该 PR 才会部署）
# - workflow_dispatch: 手动重发兜底，行为同 tag（在 tag ref 上运行才会产出 semver tag）
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    tags: ['v*.*.*']
  workflow_dispatch:

# 同一 ref 串行；避免新 commit 取消正在发布的旧 commit 导致 Docker Hub tag 错乱
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write   # 预留 cosign keyless signing 能力

env:
  REGISTRY: docker.io
  IMAGE_NAME: wontlost/ckeditor-builder
  GITOPS_REPO: wontlost-ltd/k3s
  GITOPS_PATH: apps/wontlost/ckeditor-builder

jobs:
  # ============================================================
  # Job 1: 测试 + i18n parity 校验
  # 任何触发都跑，作为质量门禁
  # ============================================================
  test:
    name: Test
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}

      - name: Run tests
        run: ./gradlew test --no-daemon --build-cache

      - name: Upload test reports on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: |
            build/reports/tests/**
            build/test-results/**
          retention-days: 7

      - name: i18n parity check
        run: bash scripts/check-i18n-parity.sh

      - name: Verify version sync (tag triggers only)
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          # 用 [[:space:]] 而非 \s：BSD sed（macOS）不支持 \s，会静默不替换，
          # 导致本地无法复现该门禁。POSIX 字符类在 GNU/BSD 下行为一致。
          GRADLE_VERSION=$(grep -E "^version[[:space:]]*=" build.gradle \
            | sed -E "s/version[[:space:]]*=[[:space:]]*['\"]([^'\"]+)['\"].*/\1/")
          if [[ "${TAG_VERSION}" != "${GRADLE_VERSION}" ]]; then
            echo "::error::Git tag v${TAG_VERSION} does not match build.gradle version ${GRADLE_VERSION}"
            exit 1
          fi
          echo "Version sync OK: tag=${TAG_VERSION} gradle=${GRADLE_VERSION}"

  # ============================================================
  # Job 2: 构建并推送 arm64 镜像到 Docker Hub
  # 仅 tag / 手动 dispatch 推；main 推送只跑测试，不产出镜像
  # ============================================================
  docker-build-push:
    name: Build & Push Image
    needs: test
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04-arm
    outputs:
      image-digest: ${{ steps.build.outputs.digest }}
      image-tags: ${{ steps.meta.outputs.tags }}
      primary-tag: ${{ steps.meta.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          # 本 job 只在 tag / dispatch 下运行，故不再有 branch 相关的 tag 规则。
          # tag 触发产出：v5.2.4 / 5.2 / 5 / latest / sha-<short>
          tags: |
            type=ref,event=tag
            type=semver,pattern={{major}}.{{minor}},enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=semver,pattern={{major}},enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=sha,prefix=sha-,format=short
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}

      - name: Build & push image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache
          cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache,mode=max
          provenance: true
          sbom: true

      - name: Verify Vaadin production bundle in jar
        run: |
          IMAGE="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}"
          echo "Inspecting jar contents in ${IMAGE}"
          # 运行时镜像基于 alpine + jlink JRE，没有 jar 命令；
          # 把 jar 拷到 runner 上用 unzip 检查（jar 文件本质是 zip）
          CID=$(docker create "${IMAGE}")
          docker cp "${CID}:/app/app.jar" /tmp/app.jar
          docker rm "${CID}"
          echo "--- sample of Vaadin production bundle entries ---"
          unzip -l /tmp/app.jar | grep -E 'META-INF/VAADIN/webapp/VAADIN/build/' | head -10 || true
          # Vaadin 25 把 production bundle 放在 META-INF/VAADIN/webapp/VAADIN/build/
          # 至少应包含 FlowClient-*.js 这种核心 chunk
          if ! unzip -l /tmp/app.jar | grep -qE 'META-INF/VAADIN/webapp/VAADIN/build/FlowClient-.*\.js$'; then
            echo '::error::Vaadin production bundle missing (no FlowClient chunk under META-INF/VAADIN/webapp/VAADIN/build/)'
            exit 1
          fi
          echo "Vaadin production bundle verified"

      - name: Smoke test container
        run: |
          IMAGE="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}"
          docker run -d --name smoke-test -p 8082:8082 "${IMAGE}"
          # 最多等 90s，3s 间隔
          for i in $(seq 1 30); do
            code=$(curl -sw '%{http_code}' -o /tmp/h.json http://localhost:8082/actuator/health || echo 000)
            if [[ "${code}" == "200" ]]; then
              echo "Health check passed on attempt ${i}"
              cat /tmp/h.json
              exit 0
            fi
            echo "attempt ${i}: HTTP ${code}"
            sleep 3
          done
          echo "::error::Health check did not return 200 within 90s"
          docker logs smoke-test
          exit 1

      - name: Stop smoke test container
        if: always()
        run: docker rm -f smoke-test || true

      - name: Trivy vulnerability scan (report only)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}
          severity: 'CRITICAL,HIGH'
          exit-code: '0'   # 初期仅报告不阻断；稳定后改为 '1' 阻断 CRITICAL
          format: 'table'

  # ============================================================
  # Job 3: 通过 GitHub App 更新 k3s GitOps 仓库
  # 写入 immutable digest，触发 ArgoCD sync
  # ============================================================
  update-gitops:
    name: Update GitOps Repo
    needs: docker-build-push
    runs-on: ubuntu-latest
    steps:
      # 该 App 在 k3s 仓库上需要 Contents: write（推分支）与 Pull requests: write（开 PR）。
      # 若缺少后者，"Commit & open PR" 会在 gh pr create 处报 403。
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.K3S_GITHUB_APP_ID }}
          private-key: ${{ secrets.K3S_GITHUB_APP_PRIVATE_KEY }}
          owner: wontlost-ltd
          repositories: k3s

      - name: Checkout k3s repo
        uses: actions/checkout@v7
        with:
          repository: ${{ env.GITOPS_REPO }}
          token: ${{ steps.app-token.outputs.token }}
          path: k3s
          fetch-depth: 1

      - name: Install kustomize
        run: |
          curl -fsSL -o kustomize.tar.gz \
            "https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize/v5.4.3/kustomize_v5.4.3_linux_amd64.tar.gz"
          tar -xzf kustomize.tar.gz
          sudo install kustomize /usr/local/bin/

      - name: Update image digest in kustomization
        working-directory: k3s/${{ env.GITOPS_PATH }}
        run: |
          # kustomize 支持 NAME=NEW_NAME:TAG@DIGEST 语法，同时产出可读 tag 和不可变 digest
          # 部署最终引用的是 digest，tag 仅作可读标记
          kustomize edit set image \
            "${{ env.IMAGE_NAME }}=${{ env.IMAGE_NAME }}:${{ needs.docker-build-push.outputs.primary-tag }}@${{ needs.docker-build-push.outputs.image-digest }}"
          echo "--- kustomization.yaml after edit ---"
          cat kustomization.yaml
          echo "--- preview rendered Deployment image field ---"
          kustomize build . | grep -E '^\s+image:' | head -3

      # k3s 仓库 main 受分支保护：要求经 PR 合并，且必须通过 verify / verify-image-pin
      # 状态检查。直推会被 GH013 拒绝，故此处改为推分支 + 开 PR，由对方仓库的检查与
      # 审阅者决定何时合并（合并即部署）。
      - name: Commit & open PR
        working-directory: k3s
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          PRIMARY_TAG: ${{ needs.docker-build-push.outputs.primary-tag }}
          IMAGE_DIGEST: ${{ needs.docker-build-push.outputs.image-digest }}
        run: |
          git config user.name 'ckeditor-builder-gitops[bot]'
          git config user.email '${{ steps.app-token.outputs.app-slug }}[bot]@users.noreply.github.com'
          if git diff --quiet; then
            echo "No image change detected, skipping commit"
            exit 0
          fi

          # 分支名带上游 commit SHA + ref 名，便于追溯。
          # 保留 ref 名：同一 commit 可能被打上多个 tag（如补发或改名），
          # 只用 SHA 会让这些 run 写到同一分支互相覆盖。
          REF_SLUG=$(echo "${GITHUB_REF_NAME}" | tr -c 'a-zA-Z0-9._-' '-' | sed 's/-*$//')
          BRANCH="ckeditor-builder/bump-${GITHUB_SHA::7}-${REF_SLUG}"
          git switch -c "${BRANCH}"

          # 判断远端是否已有同名分支：决定用普通 push 还是带 lease 的强推。
          # checkout 用了 fetch-depth:1 且未抓取该分支，本地没有对应的 remote-tracking ref，
          # 此时裸 --force-with-lease 会因无 lease 基准而被拒（stale info），故需显式区分。
          if git ls-remote --exit-code --heads origin "${BRANCH}" >/dev/null 2>&1; then
            git fetch --depth=1 origin "${BRANCH}"
            PUSH_ARGS=(--force-with-lease="${BRANCH}:$(git rev-parse FETCH_HEAD)")
          else
            PUSH_ARGS=()
          fi

          MSG="chore(ckeditor-builder): bump to ${PRIMARY_TAG}

          Image: ${{ env.IMAGE_NAME }}@${IMAGE_DIGEST}
          Source: ${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}"
          git add ${{ env.GITOPS_PATH }}/kustomization.yaml
          git commit -m "${MSG}"
          git push "${PUSH_ARGS[@]}" origin "${BRANCH}"

          # 已存在同分支的开放 PR 则复用（重跑不会刷屏），否则新建
          EXISTING=$(gh pr list --repo "${{ env.GITOPS_REPO }}" --head "${BRANCH}" \
            --state open --json number --jq '.[0].number // empty')
          if [[ -n "${EXISTING}" ]]; then
            echo "Reusing existing PR #${EXISTING} (branch updated)"
            gh pr view "${EXISTING}" --repo "${{ env.GITOPS_REPO }}" --json url --jq .url
          else
            gh pr create \
              --repo "${{ env.GITOPS_REPO }}" \
              --head "${BRANCH}" \
              --base main \
              --title "chore(ckeditor-builder): bump to ${PRIMARY_TAG}" \
              --body "Automated image bump from [\`${GITHUB_SHA::7}\`](${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}).

          | | |
          | --- | --- |
          | Image | \`${{ env.IMAGE_NAME }}\` |
          | Tag | \`${PRIMARY_TAG}\` |
          | Digest | \`${IMAGE_DIGEST}\` |

          Deployment pins the immutable digest; the tag is a human-readable marker only.

          Merging this PR deploys to the cluster."
          fi
