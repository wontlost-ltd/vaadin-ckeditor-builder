name: release

# 触发策略：
# - pull_request: 仅跑测试，不构建镜像
# - push main: 测试 -> 构建 arm64 镜像 -> 推 Docker Hub -> 更新 k3s GitOps 仓库
# - push tag v*: 同上，但镜像额外推 semver tag（5.1.0 / 5.1 / 5 / latest）
# - workflow_dispatch: 手动重发兜底
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    tags: ['v*.*.*']
  workflow_dispatch:

# 同一 ref 串行；避免新 commit 取消正在发布的旧 commit 导致 Docker Hub tag 错乱
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write   # 预留 cosign keyless signing 能力

env:
  REGISTRY: docker.io
  IMAGE_NAME: wontlost/ckeditor-builder
  GITOPS_REPO: wontlost-ltd/k3s
  GITOPS_PATH: apps/wontlost/ckeditor-builder

jobs:
  # ============================================================
  # Job 1: 测试 + i18n parity 校验
  # 任何触发都跑，作为质量门禁
  # ============================================================
  test:
    name: Test
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}

      - name: Run tests
        run: ./gradlew test --no-daemon --build-cache

      - name: Upload test reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            build/reports/tests/**
            build/test-results/**
          retention-days: 7

      - name: i18n parity check (warning only)
        run: bash scripts/check-i18n-parity.sh

      - name: Verify version sync (tag triggers only)
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          GRADLE_VERSION=$(grep -E "^version\s*=" build.gradle | sed -E "s/version\s*=\s*['\"]([^'\"]+)['\"].*/\1/")
          if [[ "${TAG_VERSION}" != "${GRADLE_VERSION}" ]]; then
            echo "::error::Git tag v${TAG_VERSION} does not match build.gradle version ${GRADLE_VERSION}"
            exit 1
          fi
          echo "Version sync OK: tag=${TAG_VERSION} gradle=${GRADLE_VERSION}"

  # ============================================================
  # Job 2: 构建并推送 arm64 镜像到 Docker Hub
  # PR 不推，仅 main / tag / dispatch 推
  # ============================================================
  docker-build-push:
    name: Build & Push Image
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04-arm
    outputs:
      image-digest: ${{ steps.build.outputs.digest }}
      image-tags: ${{ steps.meta.outputs.tags }}
      primary-tag: ${{ steps.meta.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=semver,pattern={{major}}.{{minor}},enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=semver,pattern={{major}},enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=sha,prefix=sha-,format=short
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}

      - name: Build & push image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache
          cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache,mode=max
          provenance: true
          sbom: true

      - name: Verify Vaadin production bundle in jar
        run: |
          IMAGE="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}"
          echo "Inspecting jar contents in ${IMAGE}"
          # 检查 jar 内是否包含 production hashed bundle，确认 vaadinBuildFrontend 实际执行
          docker run --rm --entrypoint sh "${IMAGE}" -c \
            "jar tf app.jar | grep -E 'META-INF/VAADIN/(build|webapp)' | head -10 && \
             jar tf app.jar | grep -q 'META-INF/VAADIN/build/' || \
             { echo '::error::Vaadin production bundle missing from jar'; exit 1; }"

      - name: Smoke test container
        run: |
          IMAGE="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}"
          docker run -d --name smoke-test -p 8082:8082 "${IMAGE}"
          # 最多等 90s，3s 间隔
          for i in $(seq 1 30); do
            code=$(curl -sw '%{http_code}' -o /tmp/h.json http://localhost:8082/actuator/health || echo 000)
            if [[ "${code}" == "200" ]]; then
              echo "Health check passed on attempt ${i}"
              cat /tmp/h.json
              exit 0
            fi
            echo "attempt ${i}: HTTP ${code}"
            sleep 3
          done
          echo "::error::Health check did not return 200 within 90s"
          docker logs smoke-test
          exit 1

      - name: Stop smoke test container
        if: always()
        run: docker rm -f smoke-test || true

      - name: Trivy vulnerability scan (report only)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}
          severity: 'CRITICAL,HIGH'
          exit-code: '0'   # 初期仅报告不阻断；稳定后改为 '1' 阻断 CRITICAL
          format: 'table'

  # ============================================================
  # Job 3: 通过 GitHub App 更新 k3s GitOps 仓库
  # 写入 immutable digest，触发 ArgoCD sync
  # ============================================================
  update-gitops:
    name: Update GitOps Repo
    needs: docker-build-push
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.K3S_GITHUB_APP_ID }}
          private-key: ${{ secrets.K3S_GITHUB_APP_PRIVATE_KEY }}
          owner: wontlost-ltd
          repositories: k3s

      - name: Checkout k3s repo
        uses: actions/checkout@v4
        with:
          repository: ${{ env.GITOPS_REPO }}
          token: ${{ steps.app-token.outputs.token }}
          path: k3s
          fetch-depth: 1

      - name: Install kustomize
        run: |
          curl -fsSL -o kustomize.tar.gz \
            "https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize/v5.4.3/kustomize_v5.4.3_linux_amd64.tar.gz"
          tar -xzf kustomize.tar.gz
          sudo install kustomize /usr/local/bin/

      - name: Update image digest in kustomization
        working-directory: k3s/${{ env.GITOPS_PATH }}
        run: |
          # kustomize 支持 NAME=NEW_NAME:TAG@DIGEST 语法，同时产出可读 tag 和不可变 digest
          # 部署最终引用的是 digest，tag 仅作可读标记
          kustomize edit set image \
            "${{ env.IMAGE_NAME }}=${{ env.IMAGE_NAME }}:${{ needs.docker-build-push.outputs.primary-tag }}@${{ needs.docker-build-push.outputs.image-digest }}"
          echo "--- kustomization.yaml after edit ---"
          cat kustomization.yaml
          echo "--- preview rendered Deployment image field ---"
          kustomize build . | grep -E '^\s+image:' | head -3

      - name: Commit & push
        working-directory: k3s
        run: |
          git config user.name 'ckeditor-builder-gitops[bot]'
          git config user.email '${{ steps.app-token.outputs.app-slug }}[bot]@users.noreply.github.com'
          if git diff --quiet; then
            echo "No image change detected, skipping commit"
            exit 0
          fi
          MSG="chore(ckeditor-builder): bump to ${{ needs.docker-build-push.outputs.primary-tag }}

          Image: ${{ env.IMAGE_NAME }}@${{ needs.docker-build-push.outputs.image-digest }}
          Source: ${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}"
          git add ${{ env.GITOPS_PATH }}/kustomization.yaml
          git commit -m "${MSG}"
          git push origin HEAD:main
