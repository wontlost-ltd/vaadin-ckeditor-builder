  <!-- Dark Mode Style Helper for inline styles -->
  <script>
    // Function to apply dark mode styles to elements with inline styles
    window.applyDarkModeToElements = function() {
      var isDark = document.documentElement.getAttribute('theme') === 'dark';

      // Search bar container
      document.querySelectorAll('.plugin-search-bar').forEach(function(el) {
        el.style.setProperty('background', isDark ? '#1f2937' : 'white', 'important');
        el.style.setProperty('border-color', isDark ? '#374151' : '#e5e7eb', 'important');
      });

      // Filter buttons and lang tabs containers
      document.querySelectorAll('.plugin-filter-buttons, .export-lang-tabs').forEach(function(el) {
        el.style.setProperty('background', isDark ? '#374151' : '#f3f4f6', 'important');
      });

      // Buttons inside filter/lang containers
      document.querySelectorAll('.plugin-filter-button, .export-lang-tab').forEach(function(btn) {
        var isActive = btn.classList.contains('active');
        if (isActive) {
          btn.style.setProperty('background', isDark ? '#1f2937' : 'white', 'important');
          btn.style.setProperty('color', isDark ? '#60a5fa' : '#2563eb', 'important');
        } else {
          btn.style.setProperty('background', 'transparent', 'important');
          btn.style.setProperty('color', isDark ? '#9ca3af' : '#6b7280', 'important');
        }
      });

      // Text field shadow DOM
      document.querySelectorAll('.plugin-search-input, .plugin-search-bar vaadin-text-field').forEach(function(el) {
        if (el.shadowRoot) {
          var inputField = el.shadowRoot.querySelector('[part="input-field"]');
          if (inputField) {
            inputField.style.setProperty('background', isDark ? '#374151' : '#f9fafb', 'important');
            inputField.style.setProperty('border-color', isDark ? '#4b5563' : '#e5e7eb', 'important');
            inputField.style.setProperty('color', isDark ? '#f3f4f6' : '#1f2937', 'important');
          }
        }
      });

      // Panel headers with gradient backgrounds
      document.querySelectorAll('.panel-header, [style*="app-gradient-header"]').forEach(function(el) {
        var style = el.getAttribute('style') || '';
        if (style.includes('gradient') || style.includes('#f8fafc') || style.includes('#f1f5f9')) {
          el.style.setProperty('background', isDark ? 'linear-gradient(135deg, #1f2937 0%, #111827 100%)' : 'linear-gradient(135deg, #f8fafc 0%, #f1f5f9 100%)', 'important');
          el.style.setProperty('border-color', isDark ? '#374151' : '#e2e8f0', 'important');
        }
      });

      // Config panel and export panel headers
      document.querySelectorAll('.config-panel > div:first-child, .preview-panel > div:first-child, .export-panel > div:first-child').forEach(function(el) {
        var style = el.getAttribute('style') || '';
        if (style.includes('gradient') || style.includes('f8fafc')) {
          el.style.setProperty('background', isDark ? 'linear-gradient(135deg, #1f2937 0%, #111827 100%)' : 'linear-gradient(135deg, #f8fafc 0%, #f1f5f9 100%)', 'important');
        }
      });

      // Checkbox labels in plugin list
      document.querySelectorAll('vaadin-checkbox label[slot="label"]').forEach(function(label) {
        label.style.setProperty('color', isDark ? '#f3f4f6' : '#1f2937', 'important');
      });

      // Category headers (vaadin-details summary)
      document.querySelectorAll('vaadin-details [slot="summary"], vaadin-details-summary').forEach(function(summary) {
        summary.style.setProperty('color', isDark ? '#f3f4f6' : '#1f2937', 'important');
        // Also style spans inside
        summary.querySelectorAll('span').forEach(function(span) {
          span.style.setProperty('color', isDark ? '#f3f4f6' : '#1f2937', 'important');
        });
      });

      // Hide Configuration panel header
      document.querySelectorAll('.config-panel > .panel-header').forEach(function(header) {
        header.style.setProperty('display', 'none', 'important');
      });

      // Hide the "X plugins selected" stats card in Plugins tab
      document.querySelectorAll('.config-panel div').forEach(function(div) {
        var style = div.getAttribute('style') || '';
        // Find the blue gradient stats card (color can be hex #2563eb or rgb(37, 99, 235))
        if ((style.includes('rgb(37, 99, 235)') || style.includes('#2563eb')) && style.includes('border-radius: 16px')) {
          div.style.setProperty('display', 'none', 'important');
        }
      });

      // Update Plugins tab label with count
      var pluginsTab = document.querySelector('vaadin-tab:nth-child(2)');
      if (pluginsTab) {
        var tabSpan = pluginsTab.querySelector('span');
        if (tabSpan && (tabSpan.textContent === 'Plugins' || tabSpan.textContent.startsWith('Plugins ('))) {
          var checkboxCount = document.querySelectorAll('vaadin-checkbox[checked]').length;
          tabSpan.textContent = checkboxCount > 0 ? 'Plugins (' + checkboxCount + ')' : 'Plugins';
        }
      }

      // Vaadin tabs container (Configuration tabs: Basic, Plugins, Toolbar)
      document.querySelectorAll('.config-panel > vaadin-tabs').forEach(function(tabs) {
        tabs.style.setProperty('background', isDark ? 'linear-gradient(135deg, #1f2937 0%, #111827 100%)' : 'linear-gradient(135deg, #f8fafc 0%, #f1f5f9 100%)', 'important');

        tabs.style.setProperty('height', '69px', 'important');
        tabs.style.setProperty('padding', '0 16px', 'important');
        tabs.style.setProperty('border-bottom', isDark ? '1px solid #374151' : '1px solid #e2e8f0', 'important');

      // Vaadin tab items
      document.querySelectorAll('vaadin-tab').forEach(function(tab) {
        var isSelected = tab.hasAttribute('selected');
        tab.style.setProperty('color', isDark ? (isSelected ? '#60a5fa' : '#9ca3af') : (isSelected ? '#2563eb' : '#6b7280'), 'important');
      });

      // vaadin-details shadow DOM parts
      document.querySelectorAll('vaadin-details').forEach(function(details) {
        if (details.shadowRoot) {
          var summary = details.shadowRoot.querySelector('[part="summary"]');
          if (summary) {
            summary.style.setProperty('color', isDark ? '#f3f4f6' : '#1f2937', 'important');
          }
          var toggle = details.shadowRoot.querySelector('[part="toggle"]');
          if (toggle) {
            toggle.style.setProperty('color', isDark ? '#9ca3af' : '#6b7280', 'important');
          }
        }
      });

      // Toolbar tab content - cards with white backgrounds
      document.querySelectorAll('.config-panel div').forEach(function(div) {
        var style = div.getAttribute('style') || '';
        var computed = window.getComputedStyle(div);

        // Target cards with white backgrounds (quick actions and toolbar preview)
        if (computed.backgroundColor === 'rgb(255, 255, 255)' &&
            (style.includes('border-radius: 16px') || style.includes('border-radius: 12px'))) {
          div.style.setProperty('background', isDark ? '#1f2937' : 'white', 'important');
          div.style.setProperty('border-color', isDark ? '#374151' : '#e5e7eb', 'important');
        }
      });

      // H4 headings in config panel (like "Current Toolbar Items")
      document.querySelectorAll('.config-panel h4').forEach(function(h4) {
        h4.style.setProperty('color', isDark ? '#f3f4f6' : '#1f2937', 'important');
      });

      // Quick actions card specific styling - sticky at bottom
      document.querySelectorAll('.quick-actions-card').forEach(function(card) {
        card.style.setProperty('background', isDark ? '#1f2937' : 'white', 'important');
        card.style.setProperty('border-color', isDark ? '#374151' : '#e5e7eb', 'important');
        card.style.setProperty('position', 'sticky', 'important');
        card.style.setProperty('bottom', '0', 'important');
        card.style.setProperty('padding', '12px 16px', 'important');
        card.style.setProperty('border-top', isDark ? '1px solid #374151' : '1px solid #e5e7eb', 'important');
        card.style.setProperty('margin-top', 'auto', 'important');
        card.style.setProperty('margin-left', '-16px', 'important');
        card.style.setProperty('margin-right', '-16px', 'important');
        card.style.setProperty('margin-bottom', '-16px', 'important');
        card.style.setProperty('z-index', '10', 'important');
        card.style.setProperty('width', 'calc(100% + 32px)', 'important');
      });

      // Make plugin search bar same width as vaadin-details (remove padding from width calculation)
      document.querySelectorAll('.plugin-search-bar').forEach(function(el) {
        el.style.setProperty('box-sizing', 'border-box', 'important');
        el.style.setProperty('width', '100%', 'important');
      });

      // Make plugin action buttons (Select All, Clear, Reset) sticky at bottom
      var selectAllBtn = null;
      document.querySelectorAll('vaadin-button').forEach(function(btn) {
        if (btn.textContent && btn.textContent.includes('Select All')) {
          selectAllBtn = btn;
        }
      });
      if (selectAllBtn) {
        var horizontalLayout = selectAllBtn.parentElement;
        var containerDiv = horizontalLayout ? horizontalLayout.parentElement : null;
        if (containerDiv && containerDiv.tagName === 'DIV') {
          containerDiv.style.setProperty('position', 'sticky', 'important');
          containerDiv.style.setProperty('bottom', '0', 'important');
          containerDiv.style.setProperty('background', isDark ? '#1f2937' : 'white', 'important');
          containerDiv.style.setProperty('padding', '12px 0', 'important');
          containerDiv.style.setProperty('border-top', isDark ? '1px solid #374151' : '1px solid #e5e7eb', 'important');
          containerDiv.style.setProperty('margin-top', '12px', 'important');
          containerDiv.style.setProperty('z-index', '10', 'important');
        }
      }

      // Toolbar preview card specific styling
      document.querySelectorAll('.toolbar-preview-card').forEach(function(card) {
        card.style.setProperty('background', isDark ? '#1f2937' : 'white', 'important');
        card.style.setProperty('border-color', isDark ? '#374151' : '#e5e7eb', 'important');
      });
    };

    // Set up MutationObserver for theme changes
    (function() {
      // Observer for theme attribute changes on html element
      var themeObserver = new MutationObserver(function() {
        if (window.applyDarkModeToElements) {
          window.applyDarkModeToElements();
        }
      });
      themeObserver.observe(document.documentElement, { attributes: true, attributeFilter: ['theme'] });

      // Debounced DOM observer for new elements (prevents infinite loops)
      var domObserverTimeout = null;
      var domObserver = new MutationObserver(function(mutations) {
        if (domObserverTimeout) return;

        // Only react to significant changes, not text content changes
        var hasSignificantChange = mutations.some(function(m) {
          return m.type === 'childList' && m.addedNodes.length > 0;
        });
        if (!hasSignificantChange) return;

        domObserverTimeout = setTimeout(function() {
          domObserverTimeout = null;
          if (window.applyDarkModeToElements) {
            window.applyDarkModeToElements();
          }
          window.updatePluginsTabCount && window.updatePluginsTabCount();
        }, 150);
      });

      // Start observing DOM changes when body is ready
      if (document.body) {
        domObserver.observe(document.body, { childList: true, subtree: true });
      } else {
        document.addEventListener('DOMContentLoaded', function() {
          domObserver.observe(document.body, { childList: true, subtree: true });
        });
      }

      // Function to update plugin count in tab only
      window.updatePluginsTabCount = function() {
        var pluginsTab = document.querySelector('vaadin-tab:nth-child(2)');
        if (pluginsTab) {
          var tabSpan = pluginsTab.querySelector('span');
          if (tabSpan) {
            var checkboxCount = document.querySelectorAll('vaadin-checkbox[checked]').length;
            var newText = checkboxCount > 0 ? 'Plugins (' + checkboxCount + ')' : 'Plugins';
            if (tabSpan.textContent !== newText) {
              tabSpan.textContent = newText;
            }
          }
        }
      };

      // Apply on page load
      window.addEventListener('load', function() {
        setTimeout(window.applyDarkModeToElements, 200);
      });
    })();
